<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>造句打卡 | Instagram 风格</title>
    <!-- 引入图标 -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-app.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-firestore.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #ffffff;
            color: #000;
            max-width: 420px;
            margin: 0 auto;
            border: 1px solid #dbdbdb;
        }
        /* ========== 顶部导航栏（Ins 原版导航） ========== */
        .ins-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid #dbdbdb;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 99;
        }
        .ins-logo {
            font-family: 'Segoe Script', cursive;
            font-size: 24px;
            font-weight: 500;
        }
        .ins-nav-icon {
            font-size: 22px;
            margin-left: 18px;
            cursor: pointer;
        }
        .nav-right {
            display: flex;
            align-items: center;
        }

        /* ========== 发布弹窗（点击加号弹出发布界面） ========== */
        .publish-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .publish-box {
            width: 92%;
            max-width: 380px;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
        }
        .publish-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid #dbdbdb;
        }
        .publish-cancel {
            color: #0095f6;
            font-size: 15px;
            cursor: pointer;
        }
        .publish-title {
            font-weight: 600;
        }
        .publish-post {
            color: #0095f6;
            font-weight: 600;
            cursor: pointer;
        }
        .publish-content {
            padding: 16px;
        }
        .publish-avatar-name {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .pub-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }
        .pub-name-input {
            border: none;
            outline: none;
            font-size: 15px;
            width: 100px;
        }
        .pub-textarea {
            width: 100%;
            border: none;
            outline: none;
            font-size: 15px;
            min-height: 80px;
            resize: none;
            margin-bottom: 12px;
        }
        .pub-img-preview {
            width: 100%;
            max-height: 260px;
            object-fit: cover;
            border-radius: 8px;
            display: none;
            margin-bottom: 12px;
        }
        .pub-file {
            display: none;
        }
        .file-label {
            display: inline-block;
            color: #0095f6;
            cursor: pointer;
            font-size: 15px;
        }
        .check-tip {
            margin: 10px 0;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 13px;
        }
        .error {
            background: #fff1f2;
            color: #e02424;
        }
        .correct {
            background: #f1fff6;
            color: #22a75d;
        }

        /* ========== 动态流卡片（Ins 原版帖子） ========== */
        .feed-list {
            padding-bottom: 60px;
        }
        .post-card {
            border-bottom: 1px solid #dbdbdb;
        }
        /* 帖子头部：头像+昵称 */
        .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .post-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
        }
        .post-username {
            font-size: 14px;
            font-weight: 600;
        }
        .more-icon {
            font-size: 16px;
        }
        /* 帖子图片 */
        .post-img {
            width: 100%;
            display: block;
        }
        /* 帖子功能按钮：点赞、评论、转发 */
        .post-action {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
        }
        .action-left i {
            font-size: 24px;
            margin-right: 16px;
            cursor: pointer;
        }
        .action-right i {
            font-size: 24px;
            cursor: pointer;
        }
        /* 帖子文案 */
        .post-desc {
            padding: 0 16px 8px;
            font-size: 14px;
            line-height: 1.5;
        }
        .post-time {
            padding: 0 16px 12px;
            font-size: 12px;
            color: #8e8e8e;
        }
        /* 评论区 */
        .comment-wrap {
            border-top: 1px solid #f0f0f0;
            padding: 10px 16px;
        }
        .comment-item {
            font-size: 14px;
            margin-bottom: 6px;
            line-height: 1.4;
        }
        .comment-item b {
            margin-right: 4px;
        }
        .comment-input-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        .comment-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            padding: 6px 0;
        }
        .comment-send {
            color: #0095f6;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }
        .empty-tip {
            text-align: center;
            padding: 60px 20px;
            color: #8e8e8e;
            font-size: 15px;
        }
        /* 底部导航栏（Ins 原版底栏） */
        .ins-footer {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 420px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #dbdbdb;
            background: #fff;
        }
        .footer-icon {
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="ins-header">
        <div class="ins-logo">Instagram</div>
        <div class="nav-right">
            <i class="fa-regular fa-heart ins-nav-icon"></i>
            <i class="fa-regular fa-paper-plane ins-nav-icon"></i>
        </div>
    </header>

    <!-- 发布帖子弹窗（点击底部加号弹出） -->
    <div class="publish-mask" id="publishMask">
        <div class="publish-box">
            <div class="publish-top">
                <span class="publish-cancel" onclick="closePublish()">取消</span>
                <span class="publish-title">新建帖子</span>
                <span class="publish-post" onclick="submitWork()">分享</span>
            </div>
            <div class="publish-content">
                <div class="publish-avatar-name">
                    <div class="pub-avatar">我</div>
                    <input type="text" class="pub-name-input" id="userName" placeholder="你的昵称">
                </div>
                <textarea class="pub-textarea" id="sentText" placeholder="添加文案（请使用：白、干、瞎、空、虚 造句）"></textarea>
                <img class="pub-img-preview" id="imgPreview">
                <input type="file" class="pub-file" id="imgFile" accept="image/*">
                <label for="imgFile" class="file-label"><i class="fa-solid fa-image"></i> 选择照片</label>
                <div id="checkResult" class="check-tip"></div>
            </div>
        </div>
    </div>

    <!-- 动态流区域 -->
    <main class="feed-list" id="feedList">
        <div class="empty-tip">暂无帖子，点击底部加号发布第一条造句动态 📸</div>
    </main>

    <!-- 底部导航栏（Ins 原版） -->
    <footer class="ins-footer">
        <i class="fa-solid fa-house footer-icon"></i>
        <i class="fa-solid fa-magnifying-glass footer-icon"></i>
        <i class="fa-solid fa-plus-square footer-icon" onclick="openPublish()"></i>
        <i class="fa-regular fa-compass footer-icon"></i>
        <i class="fa-regular fa-user footer-icon"></i>
    </footer>

<script>
// 云端数据库配置
const firebaseConfig = {
  apiKey: "AIzaSyB0kF8xQ9Z8X7aQ0Z8X7aQ0Z8X7aQ0Z8X7",
  authDomain: "chinese-class-practice.firebaseapp.com",
  projectId: "chinese-class-practice",
  storageBucket: "chinese-class-practice.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef123456"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 打开/关闭发布弹窗
function openPublish(){
    document.getElementById('publishMask').style.display = 'flex';
}
function closePublish(){
    document.getElementById('publishMask').style.display = 'none';
    // 清空内容
    document.getElementById('userName').value = '';
    document.getElementById('sentText').value = '';
    document.getElementById('imgPreview').style.display = 'none';
    document.getElementById('imgFile').value = '';
    document.getElementById('checkResult').innerHTML = '';
}

// 图片预览
const imgFile = document.getElementById('imgFile');
const imgPreview = document.getElementById('imgPreview');
imgFile.addEventListener('change', function(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
        imgPreview.src = ev.target.result;
        imgPreview.style.display = 'block';
    }
    reader.readAsDataURL(file);
});

// ========== 自动纠错规则 ==========
function checkSentence(text){
    const resDom = document.getElementById('checkResult');
    const words = ['白','干','瞎','空','虚'];
    let hasWord = false;
    let tips = [];

    words.forEach(w => {
        if(text.includes(w)) hasWord = true;
    });
    if(!hasWord){
        resDom.className = "check-tip error";
        resDom.innerHTML = "⚠️ 必须使用：白、干、瞎、空、虚 任意一词造句";
        return false;
    }

    if(text.includes("白") && /白猜测|白乱想/.test(text)){
        tips.push("❌ 猜测请用「瞎」，「白」表示徒劳无果");
    }
    if(text.includes("瞎") && /瞎跑|瞎忙活/.test(text)){
        tips.push("❌ 白费力气请用「白」，「瞎」表示盲目行事");
    }
    if(text.includes("干") && /干成功|干收获/.test(text)){
        tips.push("❌ 「干」表无奈僵持，不搭配积极结果");
    }
    if(text.includes("空") && /空说谎|空骗人/.test(text)){
        tips.push("❌ 虚假请用「虚」，「空」表有名无实");
    }
    if(text.includes("虚") && /虚有外表|虚有本领/.test(text)){
        tips.push("❌ 有名无实请用「空」，「虚」表虚伪");
    }

    if(tips.length > 0){
        resDom.className = "check-tip error";
        resDom.innerHTML = tips.join("<br>");
        return false;
    }else{
        resDom.className = "check-tip correct";
        resDom.innerHTML = "✅ 用词正确，可以分享";
        return true;
    }
}

// ========== 发布帖子（提交数据） ==========
async function submitWork(){
    const name = document.getElementById('userName').value.trim();
    const content = document.getElementById('sentText').value.trim();
    const imgSrc = imgPreview.style.display === 'block' ? imgPreview.src : '';

    if(!name){
        alert("请填写你的昵称");
        return;
    }
    if(!content){
        alert("请填写造句文案");
        return;
    }

    // 执行纠错
    const pass = checkSentence(content);
    if(!pass) return;

    const now = new Date();
    const timeStr = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()} ${now.getHours()}:${now.getMinutes()}`;

    // 存入云端
    await db.collection('posts').add({
        name,
        content,
        img: imgSrc,
        time: timeStr,
        comments: []
    });

    alert("发布成功！");
    closePublish();
}

// ========== 渲染全部动态帖子（Ins 流布局） ==========
function renderFeed(){
    db.collection('posts').orderBy('time','desc').onSnapshot(snapshot => {
        const feed = document.getElementById('feedList');
        if(snapshot.empty){
            feed.innerHTML = `<div class="empty-tip">暂无帖子，点击底部加号发布第一条造句动态 📸</div>`;
            return;
        }
        let html = '';
        snapshot.forEach(doc => {
            const data = doc.data();
            const docId = doc.id;
            // 拼接评论
            let commentHtml = '';
            if(data.comments && data.comments.length > 0){
                data.comments.forEach(c => {
                    commentHtml += `<div class="comment-item"><b>${c.name}</b>${c.content}</div>`;
                });
            }
            // 单条帖子结构（完全复刻Ins）
            html += `
            <div class="post-card" data-id="${docId}">
                <div class="post-header">
                    <div class="user-info">
                        <div class="post-avatar">${data.name.charAt(0)}</div>
                        <div class="post-username">${data.name}</div>
                    </div>
                    <i class="fa-solid fa-ellipsis more-icon"></i>
                </div>
                ${data.img ? `<img class="post-img" src="${data.img}">` : ''}
                <div class="post-action">
                    <div class="action-left">
                        <i class="fa-regular fa-heart"></i>
                        <i class="fa-regular fa-comment"></i>
                        <i class="fa-solid fa-share-nodes"></i>
                    </div>
                    <div class="action-right">
                        <i class="fa-regular fa-bookmark"></i>
                    </div>
                </div>
                <div class="post-desc">
                    <b>${data.name}</b> ${data.content}
                </div>
                <div class="post-time">${data.time}</div>
                <div class="comment-wrap">
                    ${commentHtml}
                    <div class="comment-input-box">
                        <input type="text" class="comment-input" placeholder="添加评论..." data-docid="${docId}">
                        <span class="comment-send" onclick="addComment('${docId}')">发布</span>
                    </div>
                </div>
            </div>
            `;
        });
        feed.innerHTML = html;
    });
}

// ========== 发表评论 ==========
async function addComment(docId){
    const input = document.querySelector(`.comment-input[data-docid="${docId}"]`);
    const txt = input.value.trim();
    if(!txt){
        alert("请输入评论内容");
        return;
    }
    const docRef = db.collection('posts').doc(docId);
    await docRef.update({
        comments: firebase.firestore.FieldValue.arrayUnion({
            name: "访客",
            content: txt
        })
    });
    input.value = '';
}

// 页面初始化
renderFeed();
</script>
</body>
</html>
